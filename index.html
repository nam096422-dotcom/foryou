<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tặng em một bó hoa tươi thắm 🌹</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background-color: #f9dcd8;
      background-image: radial-gradient(#ffffff 1px, transparent 1px), radial-gradient(#ffffff 1px, #f9dcd8 1px);
      background-size: 30px 30px; background-position: 0 0, 15px 15px;
      font-family: 'Quicksand', sans-serif; overflow-x: hidden; padding: 24px;
    }
    #bouquet-screen { text-align: center; cursor: pointer; z-index: 10; }
    .bouquet-img { width: 280px; max-width: 80vw; border-radius: 24px; animation: floatBouquet 2.5s infinite ease-in-out; filter: drop-shadow(0 12px 20px rgba(214,51,132,.2)); transition: transform .3s ease; }
    .bouquet-img:hover { transform: scale(1.05); }
    .hint { margin-top: 18px; color: #c92a42; font-weight: 600; font-size: 1.15rem; background: rgba(255,255,255,.75); padding: 10px 22px; border-radius: 30px; display: inline-block; box-shadow: 0 4px 12px rgba(201,42,66,.12); animation: pulse 1.8s infinite; }
    #card { display: none; width: 95%; max-width: 800px; margin: 65px auto 25px; background: rgba(255,255,255,.95); border-radius: 28px; padding: 45px 50px; box-shadow: 0 15px 35px rgba(201,42,66,.15); text-align: center; animation: popIn .8s cubic-bezier(.175,.885,.32,1.275); z-index: 10; border: 2px solid #ffd8d8; }
    .mini-bouquet { width: 130px; height: 130px; object-fit: cover; border-radius: 50%; border: 4px solid #ffccd5; margin-top: -100px; background: #f9dcd8; box-shadow: 0 6px 15px rgba(0,0,0,.1); }
    h1 { font-family: 'Dancing Script', cursive; color: #c92a42; font-size: 2.8rem; margin: 20px 0; }
    .photo-frame { width: 100%; border-radius: 16px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,.08); margin: 15px 0 25px; border: 6px solid #fff; }
    .photo-frame img { width: 100%; height: auto; display: block; }
    p.message { color: #333; line-height: 1.9; font-size: 1.15rem; text-align: left; white-space: pre-line; overflow-wrap: anywhere; background: #fff5f6; padding: 30px; border-radius: 16px; border-left: 6px solid #ff758f; min-height: 120px; }
    #final-button-wrap { display: none; margin-top: 28px; animation: popIn .7s ease both; }
    #fireworks-button { border: 0; border-radius: 999px; padding: 15px 30px; background: linear-gradient(135deg, #ff668c, #d92f69); color: #fff; font: 700 1.08rem 'Quicksand', sans-serif; cursor: pointer; box-shadow: 0 8px 22px rgba(217,47,105,.3); transition: transform .2s, box-shadow .2s; }
    #fireworks-button:hover { transform: translateY(-3px) scale(1.025); box-shadow: 0 12px 28px rgba(217,47,105,.4); }
    #fireworks-screen { display: none; position: fixed; inset: 0; z-index: 1000; width: 100%; height: 100%; border: 0; background: #02040b; }
    .petal { position: fixed; top: -10%; font-size: 20px; user-select: none; pointer-events: none; animation: fall linear infinite; z-index: 1; }
    @keyframes floatBouquet { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes popIn { from { opacity: 0; transform: scale(.75) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    @media (max-width: 600px) {
      body { padding: 18px 12px; align-items: flex-start; }
      #bouquet-screen { margin: auto 0; }
      #card { padding: 30px 20px; max-width: 100%; margin-top: 75px; }
      .mini-bouquet { width: 100px; height: 100px; margin-top: -75px; }
      h1 { font-size: 2.2rem; }
      p.message { font-size: 1.05rem; padding: 20px 15px; }
      #fireworks-button { font-size: 1rem; padding: 14px 23px; }
    }
  </style>
</head>
<body>
  <div id="bouquet-screen" onclick="openCard()">
    <img src="hoa.png" alt="Bó hoa tặng em" class="bouquet-img">
    <br><div class="hint">🌹 Chạm vào bó hoa nhaaa!</div>
  </div>

  <main id="card">
    <img src="hoa.png" alt="Bó hoa nhỏ" class="mini-bouquet">
    <h1>Gửi Người Đặc Biệt!</h1>
    <div class="photo-frame">
      <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=900" alt="Kỷ niệm">
    </div>
    <p class="message" id="typed-text"></p>
    <div id="final-button-wrap"><button id="fireworks-button" onclick="startFireworks()">✨ Bấm vào đây nèee 💗</button></div>
  </main>

  <iframe id="fireworks-screen" src="fireworks.html" title="Màn trình diễn trái tim và pháo hoa"></iframe>
  <audio id="bg-music" loop><source src="nhac.mp3" type="audio/mpeg"></audio>

  <script>
    const letterContent = `Chúc em 20/10 thật vui vẻ, luôn xinh đẹp, bình an và được yêu thương theo cách mà em xứng đáng có được nhé. Anh mong sau này em sẽ có một tương lai thật rực rỡ, làm được những điều em mong muốn và trở thành phiên bản mà em luôn tự hào về chính mình. Anh mong cuộc sống sẽ dịu dàng với em hơn một chút, những chuyện buồn sẽ vơi đi, những ngày mệt mỏi sẽ ít lại, và con đường em đi sẽ luôn có nắng, có hoa và có những người thật lòng thương em. Anh mong em sẽ luôn giữ được sự dịu dàng, tốt bụng của mình, nhưng cũng đừng quên đối xử với bản thân thật tốt, vì em cũng xứng đáng được nâng niu như cách em vẫn luôn quan tâm đến người khác vậy. Anh biết đôi khi em sẽ mệt mỏi, sẽ có những chuyện chẳng biết kể cùng ai, nhưng anh hy vọng em nhớ rằng luôn có người sẵn lòng lắng nghe em, kể cả những điều nhỏ nhặt nhất mà em nghĩ chẳng đáng để kể. Em không cần lúc nào cũng phải vui vẻ hay trở thành một phiên bản thật hoàn hảo đâu, cứ thoải mái là chính mình nhé, kể cả những lúc yếu lòng hay chẳng biết phải làm gì. Anh mong một ngày nào đó, em sẽ yêu được người mà em thật sự muốn yêu, và người ấy cũng sẽ yêu em đủ nhiều, đủ kiên nhẫn để nắm tay em đi qua những năm tháng dài rộng của cuộc đời. Mong người ấy sẽ trân trọng từng điều nhỏ bé ở em, dịu dàng với những tổn thương em chẳng dễ dàng kể ra, và luôn chọn yêu thương em bằng cả sự chân thành lẫn những hành động thiết thực. Anh mong em sẽ có thật nhiều ngày vui, nhiều khoảnh khắc đáng nhớ và một cuộc đời mà khi nhìn lại, em có thể mỉm cười vì đã được sống, được yêu thương và được hạnh phúc. Còn hôm nay, anh chỉ muốn em biết rằng em là một cô gái rất đáng quý, và anh thật lòng mong những điều tốt đẹp nhất sẽ đến với em. Chúc cô gái nhỏ của anh một ngày 20/10 thật ấm áp nhé. 🌷❤️. Sắp chuyển cảnh tối rùi ạ em em cần thận nhaaaaaa.`;

    function createPetals() {
      const petals = ['🌸', '🌹', '✨', '🩷'];
      for (let i = 0; i < 22; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.textContent = petals[Math.floor(Math.random() * petals.length)];
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = (Math.random() * 4 + 4) + 's';
        petal.style.animationDelay = (Math.random() * 5) + 's';
        document.body.appendChild(petal);
      }
    }
    createPetals();

    let cardOpened = false;
    function openCard() {
      if (cardOpened) return;
      cardOpened = true;
      document.getElementById('bouquet-screen').style.display = 'none';
      document.getElementById('card').style.display = 'block';
      const music = document.getElementById('bg-music');
      const src = music.querySelector('source').getAttribute('src');
      if (src && src !== 'LINK_FILE_NHAC_MP3_CUA_BAN.mp3') music.play().catch(() => {});
      confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 }, colors: ['#e63946', '#ff758f', '#ffb3c1', '#ffd166'] });
      let i = 0;
      const speed = 20;
      const target = document.getElementById('typed-text');
      function typeWriter() {
        if (i < letterContent.length) {
          target.textContent += letterContent.charAt(i++);
          setTimeout(typeWriter, speed);
        } else {
          document.getElementById('final-button-wrap').style.display = 'block';
          document.getElementById('final-button-wrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
          confetti({ particleCount: 45, spread: 65, origin: { y: 0.85 }, colors: ['#e63946', '#ff758f', '#ffb3c1'] });
        }
      }
      typeWriter();
    }

    function startFireworks() {
      document.getElementById('fireworks-screen').style.display = 'block';
      document.getElementById('fireworks-screen').contentWindow.postMessage('START_ROMANTIC_FIREWORKS', '*');
    }
  </script>
</body>
</html>
